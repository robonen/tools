packages:
  - configs/*
  - core/*
  - infra/*
  - vue/*
  - vue/*/playground
  - docs

allowBuilds:
  '@parcel/watcher': true
  core-js-pure: true
  dtrace-provider: true
  esbuild: true
  re2: true
  unrs-resolver: true

catalog:
  '@stylistic/eslint-plugin': ^5.10.0
  '@vitest/browser': ^4.1.9
  '@vitest/coverage-v8': ^4.1.9
  '@vitest/ui': ^4.1.9
  '@vue/shared': ^3.5.38
  '@vue/test-utils': ^2.4.11
  eslint: ^10.5.0
  jsdom: ^29.1.1
  nuxt: ^4.4.8
  tsdown: ^0.22.3
  vitest: ^4.1.9
  vue: ^3.5.38

ignoredBuiltDependencies:
  - '@parcel/watcher'
  - esbuild

minimumReleaseAgeExclude:
  - ast-kit@3.0.0
  - renovate@43.228.0
  - rolldown-plugin-dts@0.26.0
  - tsdown@0.22.3
